[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "regimix"
version = "0.1.0"
description = "Calibrated threshold-exceedance probabilities from a partial path, mixed over label-free HMM activity regimes"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3.3",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
examples = ["matplotlib>=3.6"]
test = ["pytest>=7", "pandas>=1.5"]

[tool.setuptools.packages.find]
include = ["regimix*"]

[tool.pytest.ini_options]
testpaths = ["tests", "patches/hmmlearn/tests"]
